
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Recommender | Home</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F4E9D8;
            color: #3B2922;
            font-family: 'Cormorant Garamond', serif;
        }

        /* NAVBAR */

        nav {
            background-color: #3B2922;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #F4E9D8;
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: #F4E9D8;
            text-decoration: none;
            font-size: 19px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #D6A76C;
        }

        /* HERO SECTION */

        .hero {
            text-align: center;
            padding: 75px 20px 55px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 22px;
            color: #765B4C;
        }

        .hero-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #3B2922;
            color: #F4E9D8;
            text-decoration: none;
            border-radius: 5px;
            font-size: 19px;
            transition: 0.3s;
        }

        .hero-button:hover {
            background-color: #765B4C;
        }

        /* BOOK SECTION */

        .section-title {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 35px;
            margin: 20px 0 40px;
        }

        .book-container {
            padding: 20px 8% 70px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 30px;
        }

        .book-card {
            background-color: #FFF9F0;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(59, 41, 34, 0.12);
            transition: transform 0.3s;
        }

        .book-card:hover {
            transform: translateY(-7px);
        }

        .book-card img {
            width: 100%;
            height: 230px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .book-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .book-card p {
            font-size: 17px;
            color: #765B4C;
            margin-bottom: 5px;
        }

        /* FOOTER */

        footer {
            background-color: #3B2922;
            color: #F4E9D8;
            text-align: center;
            padding: 25px;
            font-size: 18px;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .section-title {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            Alien's Book Haven
        </div>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/recommend">Recommender</a></li>
        </ul>

    </nav>


    <!-- HERO SECTION -->


    <!-- TOP 50 BOOKS -->

    <section class="book-container">

        <h2 class="section-title">
            Top 50 Popular Books
        </h2>

        <div class="book-grid">

            {% for book in books %}

            <div class="book-card">

                <img
                    src="{{ book['Image-URL-M'] }}"
                    alt="{{ book['Book-Title'] }}"
                    onerror="this.style.display='none'"
                >

                <h3>
                    {{ book['Book-Title'] }}
                </h3>

                <p>
                    By {{ book['Book-Author'] }}
                </p>

                <p>
                    Votes: {{ book['num_ratings'] }}
                </p>

                <p>
                    Average Rating: {{ book['avg_ratings'] }}
                </p>

            </div>

            {% endfor %}

        </div>

    </section>


    <!-- FOOTER -->

    <footer>
        <p>Book Haven | Your Personal Book Discovery Platform</p>
    </footer>

</body>
</html>
